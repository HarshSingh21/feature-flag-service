name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# A second push to the same branch cancels the first. Flag config is small; CI
# minutes are not.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  verify:
    name: build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Caches GOMODCACHE and GOCACHE, keyed on go.sum.
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      # gofmt exits 0 whether or not it found unformatted files - it reports by
      # printing filenames, not by its exit status. Checking $? here is the
      # classic way to ship a formatting gate that never fails. Test the output.
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -s -l . 2>&1)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            echo ""
            echo "diff:"
            gofmt -s -d .
            echo ""
            echo "fix with: make fmt"
            exit 1
          fi
          echo "gofmt: clean"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -race is not optional here. The whole config-propagation design rests on
      # an atomic pointer swap under concurrent readers; a data race in that swap
      # is a fatal runtime error in Go that recover() cannot contain.
      - name: go test -race
        run: go test -race -covermode=atomic -coverprofile=coverage.txt -count=1 ./...

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.txt ]; then
            go tool cover -func=coverage.txt | tail -n 1
          fi

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.txt
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: golangci-lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately non-blocking for now. The linter is being introduced against a
    # tree that is still being written; making it a merge gate on day one means
    # the first person to hit a false positive disables the whole job. Flip
    # continue-on-error to false once the backlog is at zero - tracked in
    # CONTRIBUTING.md.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          args: --timeout=5m
